vindatathon:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('VINDATATHON_DB_HOST', 'localhost') }}"
      port: "{{ env_var('VINDATATHON_DB_PORT', '5432') | int }}"
      user: "{{ env_var('VINDATATHON_DB_USER', 'postgres') }}"
      password: "{{ env_var('VINDATATHON_DB_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('VINDATATHON_DB_NAME', 'vindatathon') }}"
      schema: staging
      threads: 4
